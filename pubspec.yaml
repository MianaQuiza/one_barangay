name: barangay_community_app
description: Barangay Community Information System - official digital communication platform between barangay officials and residents.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.3
  firebase_storage: ^12.3.2
  firebase_messaging: ^15.1.3

  # State management
  provider: ^6.1.2

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  intl: ^0.19.0
  flutter_local_notifications: ^18.0.1

  # Maps & location
  google_maps_flutter: ^2.9.0
  geolocator: ^13.0.1

  # Media
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1

  # Utilities
  uuid: ^4.5.1
  url_launcher: ^6.3.1
  connectivity_plus: ^6.0.5
  shared_preferences: ^2.3.2

 
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  
  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    - assets/icons/